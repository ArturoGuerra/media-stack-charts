{{- $root := $ }}
{{- range $name, $instance := .Values.worker.instances }}
{{- $worker := include "tdarr.worker.merge" (dict "root" $root "instance" $instance) | fromYaml }}
{{- if $worker.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullname" $root }}-{{ $name }}
  labels: {{ include "labels" $root | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fullname" $root }}-{{ $name }}
  labels: {{ include "labels" $root | nindent 4 }}
spec:
  serviceName: {{ include "fullname" $root }}-{{ $name }}
  replicas: {{ $worker.replicaCount }}
  revisionHistoryLimit: {{ default 3 $root.Values.revisionHistoryLimit }}
  # Workers are independent of each other; start/stop them all at once.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      {{- with ($worker.podAnnotations | default $root.Values.podAnnotations) }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $worker.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with ($worker.imagePullSecrets | default $root.Values.imagePullSecrets) }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($worker.podSecurityContext | default $root.Values.podSecurityContext) }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: tdarr-node
        image: {{ printf "%s:%s" $worker.image.repository ($worker.image.tag | default $root.Chart.AppVersion) }}
        imagePullPolicy: {{ $worker.image.pullPolicy }}
        {{- with ($worker.containerSecurityContext | default $root.Values.containerSecurityContext) }}
        securityContext: {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: serverIP
          value: {{ include "service.fullname" $root }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Suffix the configured nodeName (from envFrom) with the pod name so
        # every replica registers with the server under a unique name.
        - name: nodeName
          value: "$(nodeName)-$(POD_NAME)"
        envFrom:
        - configMapRef:
            name: {{ include "configmap.fullname" $root }}-{{ $name }}
        resources:
          {{- toYaml $worker.resources | nindent 10 }}
        volumeMounts:
        {{- if $worker.configs.enabled }}
        - name: configs
          mountPath: {{ $worker.configs.mountPath }}
        {{- end }}
        {{- if $worker.transcode.enabled }}
        - name: transcode
          mountPath: {{ $worker.transcode.mountPath }}
        {{- end }}
        {{- with $worker.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      {{- if $worker.transcode.enabled }}
      - name: transcode
        emptyDir:
          {{- if $worker.transcode.medium }}
          medium: {{ $worker.transcode.medium }}
          {{- end }}
          {{- if $worker.transcode.sizeLimit }}
          sizeLimit: {{ $worker.transcode.sizeLimit }}
          {{- end }}
      {{- end }}
      {{- with $worker.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $worker.nodeSelector }}
      nodeSelector: {{- toYaml $worker.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $worker.tolerations }}
      tolerations: {{- toYaml $worker.tolerations | nindent 8 }}
      {{- end }}
      {{- if $worker.affinity }}
      affinity: {{- toYaml $worker.affinity | nindent 8 }}
      {{- end }}
  {{- if $worker.configs.enabled }}
  # One PVC per worker pod (configs-<statefulset>-<ordinal>), so RWO volumes
  # work when replicas are scheduled onto different Kubernetes nodes.
  volumeClaimTemplates:
  - metadata:
      name: configs
    spec:
      {{- if $worker.configs.storageClass }}
      storageClassName: {{ $worker.configs.storageClass }}
      {{- end }}
      accessModes:
      - {{ $worker.configs.accessMode | default "ReadWriteOnce" }}
      resources:
        requests:
          storage: {{ $worker.configs.size }}
  {{- end }}
{{- end }}
{{- end }}
